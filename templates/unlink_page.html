<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unlink Account — Ocean Scrims</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#01080F;color:#BEE8FF;font-family:'Segoe UI',system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
.card{background:rgba(4,16,36,.9);border:1px solid rgba(255,51,102,.18);border-radius:20px;padding:44px 40px;width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;box-shadow:0 20px 80px rgba(0,0,0,.7)}
.icon{font-size:3rem}
h1{font-size:1.25rem;font-weight:900;color:#fff}
p{font-size:.85rem;color:#2E6880;line-height:1.6}
.name{color:#BEE8FF;font-weight:700}
.btn-confirm{background:linear-gradient(135deg,#8B0020,#FF3366);color:#fff;border:none;border-radius:10px;padding:12px 32px;font-size:.92rem;font-weight:800;cursor:pointer;letter-spacing:.04em;transition:filter .15s,transform .15s}
.btn-confirm:hover{filter:brightness(1.2);transform:translateY(-2px)}
.btn-cancel{background:none;border:1px solid rgba(0,180,216,.2);border-radius:10px;padding:10px 24px;color:#2E6880;font-size:.84rem;cursor:pointer;transition:border-color .15s,color .15s}
.btn-cancel:hover{border-color:rgba(0,212,255,.4);color:#BEE8FF}
.footer{font-size:.68rem;color:rgba(46,104,128,.45)}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="icon">🔓</div>
  <h1>Unlink Your Account</h1>
  <p>You are about to unlink <span class="name">{{ username }}</span> from Ocean Scrims.<br>
     You will lose access to scrim lobbies until you re-verify.</p>
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
    <button class="btn-cancel" onclick="window.close()">Cancel</button>
    <button class="btn-confirm" onclick="doUnlink()">Unlink Account</button>
  </div>
  <div class="footer">🌊 Ocean Scrims  •  You can re-verify at any time</div>
</div>
<script>
async function doUnlink() {
  const btn = document.querySelector('.btn-confirm');
  btn.textContent = 'Unlinking...'; btn.disabled = true;
  const res = await fetch('/unlink/{{ token }}/confirm', { method: 'POST' });
  const data = await res.json();
  if (data.ok) {
    document.getElementById('card').innerHTML = `
      <div class="icon">✅</div>
      <h1>Account Unlinked</h1>
      <p>Your Epic account has been unlinked from Ocean Scrims.<br>You can close this tab.</p>
      <div class="footer">🌊 Ocean Scrims</div>`;
  }
}
</script>
</body>
</html>
